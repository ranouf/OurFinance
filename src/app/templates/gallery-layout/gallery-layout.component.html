<div class="mx-auto grid max-w-7xl gap-5 px-4 pb-20 sm:px-6 lg:grid-cols-[13rem_minmax(0,1fr)] lg:pb-8">
  <aside class="h-fit rounded-3xl border border-pop-border bg-white p-4 shadow-sm lg:sticky lg:top-5 lg:mt-8" [attr.aria-label]="labels[language()].nav">
    <h2 class="text-sm font-extrabold uppercase tracking-wider text-pop-primary-dark">{{ labels[language()].nav }}</h2>
    <nav class="mt-3 grid grid-cols-2 gap-1 text-sm font-bold sm:grid-cols-3 lg:grid-cols-1" [attr.aria-label]="labels[language()].nav">
      <a class="rounded-xl px-3 py-2 text-pop-text hover:bg-pop-lavender focus-visible:outline-2 focus-visible:outline-pop-primary-dark" href="#buttons">{{ labels[language()].buttons }}</a>
      <a class="rounded-xl px-3 py-2 text-pop-text hover:bg-pop-lavender focus-visible:outline-2 focus-visible:outline-pop-primary-dark" href="#fields">{{ labels[language()].fields }}</a>
      <a class="rounded-xl px-3 py-2 text-pop-text hover:bg-pop-lavender focus-visible:outline-2 focus-visible:outline-pop-primary-dark" href="#alerts">{{ labels[language()].alerts }}</a>
      <a class="rounded-xl px-3 py-2 text-pop-text hover:bg-pop-lavender focus-visible:outline-2 focus-visible:outline-pop-primary-dark" href="#badges">{{ labels[language()].badges }}</a>
      <a class="rounded-xl px-3 py-2 text-pop-text hover:bg-pop-lavender focus-visible:outline-2 focus-visible:outline-pop-primary-dark" href="#qr">{{ labels[language()].qr }}</a>
      <a class="rounded-xl px-3 py-2 text-pop-text hover:bg-pop-lavender focus-visible:outline-2 focus-visible:outline-pop-primary-dark" href="#navigation">{{ labels[language()].navigation }}</a>
    </nav>
  </aside>
  <div class="min-w-0"><router-outlet /></div>
</div>
