<dialog #dialog class="m-auto w-[min(90vw,25rem)] rounded-2xl border border-pop-border bg-white p-0 text-pop-text shadow-[0_18px_45px_#3027524d] backdrop:bg-pop-text/45" [attr.aria-label]="title" (cancel)="onCancel($event)" (close)="onClose()">
  <div class="flex items-start justify-between gap-3 border-b border-pop-border px-4 py-3"><h2 class="text-sm font-black">{{ title }}</h2><button type="button" class="flex size-8 items-center justify-center rounded-lg text-xl hover:bg-pop-lavender focus-visible:outline-2 focus-visible:outline-pop-primary" [attr.aria-label]="closeLabel" (click)="close()">×</button></div>
  <div class="p-4"><ng-content /></div>
</dialog>
