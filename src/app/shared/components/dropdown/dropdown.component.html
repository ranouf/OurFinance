<div class="relative">
  <button [id]="controlId" type="button" role="combobox" aria-haspopup="listbox" [attr.aria-controls]="controlId + '-listbox'"
    [attr.aria-expanded]="open()" [attr.aria-activedescendant]="open() ? controlId + '-option-' + activeIndex() : null"
    [attr.aria-invalid]="invalid || null" [attr.aria-describedby]="describedBy || null" [disabled]="disabled"
    class="flex min-h-11 w-full items-center gap-2 rounded-[10px] border border-pop-border bg-white px-3 text-left text-sm font-bold text-pop-text focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-pop-primary disabled:bg-slate-100 disabled:text-pop-muted"
    [class.border-red-400]="invalid" (click)="toggle()" (keydown)="onKeydown($event)">
    @if (selected()?.iconSrc; as icon) { <img class="size-6 shrink-0 object-contain" [src]="icon" alt="" /> }
    <span class="min-w-0 flex-1 truncate">{{ selected()?.label || placeholder }}</span><span class="text-lg" aria-hidden="true">⌄</span>
  </button>
  @if (open()) {
    <div [id]="controlId + '-listbox'" role="listbox" class="absolute z-20 mt-1 max-h-52 w-full overflow-auto rounded-xl border border-pop-border bg-white p-1 shadow-[0_8px_24px_#45309029]">
      @for (option of options; track option.value; let index = $index) {
        <button [id]="controlId + '-option-' + index" type="button" role="option" [attr.aria-selected]="option.value === value" [disabled]="option.disabled"
          class="flex min-h-10 w-full items-center gap-2 rounded-lg px-2 text-left text-sm hover:bg-pop-lavender focus-visible:outline-2 focus-visible:outline-pop-primary disabled:opacity-45"
          [class.bg-pop-lavender]="option.value === value || index === activeIndex()" (click)="choose(option)">
          @if (option.iconSrc) { <img class="size-6 shrink-0 object-contain" [src]="option.iconSrc" alt="" /> }
          <span class="flex-1">{{ option.label }}</span>@if (option.value === value) { <span aria-hidden="true">✓</span> }
        </button>
      }
    </div>
  }
</div>
