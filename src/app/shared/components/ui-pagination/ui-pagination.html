<nav class="flex items-center gap-1" [attr.aria-label]="label">
  <button type="button" class="size-9 rounded-lg border border-pop-border bg-white text-pop-primary-dark focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-pop-primary-dark disabled:opacity-40" [disabled]="page <= 1" [attr.aria-label]="previousLabel" (click)="select(page - 1)">‹</button>
  @for (number of pages(); track number) {
    <button type="button" class="size-9 rounded-lg border border-pop-border text-xs font-extrabold focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-pop-primary-dark" [class.bg-pop-primary]="page === number" [class.text-white]="page === number" [class.bg-white]="page !== number" [attr.aria-current]="page === number ? 'page' : null" [attr.aria-label]="number" (click)="select(number)">{{ number }}</button>
  }
  <button type="button" class="size-9 rounded-lg border border-pop-border bg-white text-pop-primary-dark focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-pop-primary-dark disabled:opacity-40" [disabled]="page >= pageCount" [attr.aria-label]="nextLabel" (click)="select(page + 1)">›</button>
</nav>
