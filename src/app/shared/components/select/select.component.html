<select class="min-h-11 w-full rounded-xl border border-pop-border bg-white px-3 text-sm text-pop-text focus:border-pop-primary focus:outline-2 focus:outline-offset-2 focus:outline-pop-primary-dark disabled:bg-pop-background disabled:text-pop-muted"
  [id]="controlId" [value]="value" [disabled]="disabled" [attr.aria-invalid]="invalid || null" [attr.aria-describedby]="describedBy || null" (change)="change($event)" (blur)="touch()">
  @for (option of options; track option.value) { <option [value]="option.value" [selected]="option.value === value">{{ option.label }}</option> }
</select>
