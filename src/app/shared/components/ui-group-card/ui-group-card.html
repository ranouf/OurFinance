@if (interactive) {
  <button type="button" class="flex max-[240px]:flex-col max-[240px]:items-start min-h-14 w-full items-center gap-2.5 rounded-xl border border-pop-border bg-white px-2.5 py-2 text-left shadow-[0_2px_8px_#5140a412] focus-visible:outline-2 focus-visible:outline-pop-primary-dark" [class.bg-pop-lavender]="selected" [attr.aria-pressed]="selected" (click)="activated.emit()">
    <app-ui-icon-badge [name]="icon" [tone]="iconTone" />
    <span class="min-w-0 flex-1"><strong class="block truncate max-[240px]:whitespace-normal max-[240px]:break-words text-xs font-black">{{ name }}</strong><small class="block text-[11px] text-pop-muted">{{ detail }}</small></span>
    <strong class="whitespace-nowrap text-xs font-black" [class.text-emerald-700]="amountTone === 'positive'" [class.text-red-600]="amountTone === 'negative'">{{ amount }}</strong>
    <span class="text-lg text-pop-primary-dark" aria-hidden="true">›</span>
  </button>
} @else {
  <div class="flex max-[240px]:flex-col max-[240px]:items-start min-h-14 items-center gap-2.5 rounded-xl border border-pop-border bg-white px-2.5 py-2 shadow-[0_2px_8px_#5140a412]" [class.bg-pop-lavender]="selected">
    <app-ui-icon-badge [name]="icon" [tone]="iconTone" />
    <span class="min-w-0 flex-1"><strong class="block truncate max-[240px]:whitespace-normal max-[240px]:break-words text-xs font-black">{{ name }}</strong><small class="block text-[11px] text-pop-muted">{{ detail }}</small></span>
    <strong class="whitespace-nowrap text-xs font-black" [class.text-emerald-700]="amountTone === 'positive'" [class.text-red-600]="amountTone === 'negative'">{{ amount }}</strong>
    <span class="text-lg text-pop-primary-dark" aria-hidden="true">›</span>
  </div>
}
