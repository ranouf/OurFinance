<details class="group border-b border-pop-border py-2" [open]="expanded">
  <summary class="flex min-h-8 cursor-pointer list-none items-center justify-between gap-2 text-xs font-extrabold focus-visible:outline-2 focus-visible:outline-pop-primary-dark">{{ title }}<span class="text-pop-primary-dark group-open:rotate-180" aria-hidden="true">⌄</span></summary>
  <div class="pb-2 text-xs leading-relaxed text-pop-muted"><ng-content /></div>
</details>
