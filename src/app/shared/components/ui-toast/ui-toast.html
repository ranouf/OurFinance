@if (!closed()) { <div class="flex min-h-11 items-center gap-3 rounded-xl border px-3 py-2 text-sm font-semibold shadow-[0_4px_16px_#3027521f]" [class.border-emerald-200]="variant === 'success'" [class.bg-emerald-50]="variant === 'success'" [class.border-indigo-200]="variant === 'info'" [class.bg-indigo-50]="variant === 'info'" [class.border-red-200]="variant === 'error'" [class.bg-red-50]="variant === 'error'" [attr.role]="variant === 'error' ? 'alert' : 'status'"><span class="min-w-0 flex-1"><ng-content /></span>@if (dismissible) { <button type="button" class="size-8 rounded-md text-lg focus-visible:outline-2 focus-visible:outline-pop-primary" [attr.aria-label]="closeLabel" (click)="close()">×</button> }</div> }
