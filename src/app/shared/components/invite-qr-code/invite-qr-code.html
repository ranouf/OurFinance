<div class="mx-auto w-fit max-w-full rounded-2xl bg-white p-4 shadow-sm" role="img" [attr.aria-label]="label">
  <qrcode [qrdata]="link" [width]="width" [margin]="4" [errorCorrectionLevel]="'M'" [ariaLabel]="label" />
</div>
<div class="mt-3 flex flex-wrap justify-center gap-2">
  <app-ui-button (click)="copy()">{{ copyLabel }}</app-ui-button>
  @if (canShare()) { <app-ui-button variant="secondary" (click)="share()">{{ shareLabel }}</app-ui-button> }
</div>
@if (message()) { <p class="mt-2 text-center text-sm" role="status">{{ message() }}</p> }
