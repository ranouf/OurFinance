<button
  class="inline-flex min-h-11 items-center justify-center rounded-xl border px-5 py-2.5 text-sm font-extrabold transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-pop-primary-dark disabled:cursor-not-allowed disabled:opacity-50"
  [class.border-pop-primary]="variant === 'primary'"
  [class.bg-pop-primary]="variant === 'primary'"
  [class.text-white]="variant === 'primary' || variant === 'coral' || variant === 'danger'"
  [class.hover:bg-pop-primary-dark]="variant === 'primary'"
  [class.border-pop-coral]="variant === 'coral'"
  [class.bg-pop-coral]="variant === 'coral'"
  [class.hover:brightness-95]="variant === 'coral'"
  [class.border-pop-border]="variant === 'secondary'"
  [class.bg-white]="variant === 'secondary' || variant === 'outline'"
  [class.text-pop-primary-dark]="variant === 'secondary'"
  [class.hover:bg-pop-lavender]="variant === 'secondary' || variant === 'outline' || variant === 'ghost'"
  [class.border-pop-primary]="variant === 'outline'"
  [class.text-pop-primary-dark]="variant === 'outline' || variant === 'ghost'"
  [class.border-transparent]="variant === 'ghost'"
  [class.border-red-700]="variant === 'danger'"
  [class.bg-red-700]="variant === 'danger'"
  [class.hover:bg-red-800]="variant === 'danger'"
  [type]="type"
  [disabled]="disabled || loading"
  [attr.aria-busy]="loading || null"
><ng-content /></button>
