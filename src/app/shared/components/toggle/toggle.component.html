<label class="inline-flex min-h-11 cursor-pointer items-center gap-3 text-sm font-semibold text-pop-text" [for]="controlId">
  <span class="relative inline-flex items-center">
    <input class="peer sr-only" type="checkbox" role="switch" [id]="controlId" [checked]="checked" [disabled]="disabled" [attr.aria-describedby]="describedBy || null" (change)="change($event)" (blur)="touch()" />
    <span class="h-7 w-12 rounded-full bg-pop-border transition-colors peer-checked:bg-pop-primary peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-pop-primary-dark peer-disabled:opacity-50"></span>
    <span class="pointer-events-none absolute left-1 size-5 rounded-full bg-white shadow-sm transition-transform peer-checked:translate-x-5"></span>
  </span>
  <span>{{ label }}</span>
</label>
