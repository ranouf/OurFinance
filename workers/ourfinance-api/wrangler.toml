name = "ourfinance-api-dev"
main = "src/index.ts"
compatibility_date = "2026-11-15"
workers_dev = false

[vars]
ENABLE_TEST_EXPENSES = "true"
ENABLE_TEST_CATEGORIES = "true"
ENABLE_TEST_INVITATIONS = "true"
ENABLE_TEST_RESTORE_PREVIEW = "true"
FIREBASE_PROJECT_ID = "ourfinance-test"
ALLOWED_ORIGIN = "https://ourfinance-test.web.app"
ALLOWED_SECONDARY_ORIGIN = "https://ourfinance-test.firebaseapp.com"

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "7491201"

[ratelimits.simple]
limit = 120
period = 60
