name: PR validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test tests/ci/*.test.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: npm run typecheck:worker
      - run: npm run lint:worker
      - run: npm run test:coverage
      - run: npm run test:rules
