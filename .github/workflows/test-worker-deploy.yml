name: Deploy test Worker manually
on:
  pull_request:
    paths:
      - .github/workflows/test-worker-deploy.yml
      - workers/ourfinance-api/**
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA to deploy on TEST
        required: true
        type: string
      coordination_comment:
        description: URL of the active TEST reservation in issue 30
        required: true
        type: string
permissions:
  contents: read
  issues: read
  actions: read
jobs:
  worker_dry_run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check the TEST bundle without credentials
        run: |
          cat > workers/ourfinance-api/wrangler.ci.toml <<'EOF'
          name = "ourfinance-api-dev"
          main = "src/index.ts"
          compatibility_date = "2026-11-15"
          workers_dev = true

          [vars]
          ENABLE_TEST_EXPENSES = "true"
          ENABLE_TEST_GROUP_SETTINGS = "true"
          ENABLE_TEST_RESTORES = "true"
          ENABLE_TEST_BACKUPS = "true"
          ENABLE_TEST_COMMENTS = "true"
          ENABLE_TEST_IMPORTS = "true"
          ENABLE_TEST_RECEIPTS = "true"
          ENABLE_TEST_SETTLEMENTS = "true"
          ENABLE_TEST_CATEGORIES = "true"
          ENABLE_TEST_INVITATIONS = "true"
          ENABLE_TEST_RESTORE_PREVIEW = "true"
          FIREBASE_PROJECT_ID = "ourfinance-test"
          ALLOWED_ORIGIN = "https://ourfinance-test.web.app"
          ALLOWED_SECONDARY_ORIGIN = "https://ourfinance-test.firebaseapp.com"

          [[ratelimits]]
          name = "API_RATE_LIMITER"
          namespace_id = "7491201"

          [ratelimits.simple]
          limit = 120
          period = 60
          EOF
          npx --yes wrangler@4.164.0 deploy --dry-run --config workers/ourfinance-api/wrangler.ci.toml
  worker_test:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'ranouf' && github.triggering_actor == 'ranouf'
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: ourfinance-test-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check exact SHA and reservation
        env:
          TARGET_SHA: ${{ inputs.sha }}
          RESERVATION: ${{ inputs.coordination_comment }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RESERVATION" =~ ^https://github\.com/ranouf/OurFinance/issues/30#issuecomment-[0-9]+$ ]]
          comment_id="${RESERVATION##*issuecomment-}"
          comment_file="$(mktemp)"
          trap 'rm -f "$comment_file"' EXIT
          gh api "repos/ranouf/OurFinance/issues/comments/$comment_id" > "$comment_file"
          bash scripts/verify-test-reservation.sh "$TARGET_SHA" "$comment_file"
      - name: Require successful PR validation on exact SHA
        env:
          TARGET_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/ranouf/OurFinance/actions/runs?head_sha=$TARGET_SHA&per_page=100" |
            jq -e --arg sha "$TARGET_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha and .path == ".github/workflows/pr-validation.yml")]
              | first | .conclusion == "success"
            ' >/dev/null
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out commit
        env:
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor 04d521960fc37e63266f72500ef0cc4fb0cd7393 HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck:worker && npm run test:worker
      - name: Write isolated deployment configuration
        env:
          RATE_LIMIT_NAMESPACE_ID: ${{ vars.CLOUDFLARE_TEST_RATE_LIMIT_NAMESPACE_ID }}
        run: |
          test "$RATE_LIMIT_NAMESPACE_ID" = '7491201'
          cat > workers/ourfinance-api/wrangler.ci.toml <<'EOF'
          name = "ourfinance-api-dev"
          main = "src/index.ts"
          compatibility_date = "2026-11-15"
          workers_dev = true

          [vars]
          ENABLE_TEST_EXPENSES = "true"
          ENABLE_TEST_GROUP_SETTINGS = "true"
          ENABLE_TEST_RESTORES = "true"
          ENABLE_TEST_BACKUPS = "true"
          ENABLE_TEST_COMMENTS = "true"
          ENABLE_TEST_IMPORTS = "true"
          ENABLE_TEST_RECEIPTS = "true"
          ENABLE_TEST_SETTLEMENTS = "true"
          ENABLE_TEST_CATEGORIES = "true"
          ENABLE_TEST_INVITATIONS = "true"
          ENABLE_TEST_RESTORE_PREVIEW = "true"
          FIREBASE_PROJECT_ID = "ourfinance-test"
          ALLOWED_ORIGIN = "https://ourfinance-test.web.app"
          ALLOWED_SECONDARY_ORIGIN = "https://ourfinance-test.firebaseapp.com"

          [[ratelimits]]
          name = "API_RATE_LIMITER"
          namespace_id = "TEST_RATE_LIMIT_NAMESPACE_ID"

          [ratelimits.simple]
          limit = 120
          period = 60
          EOF
          sed -i "s/TEST_RATE_LIMIT_NAMESPACE_ID/$RATE_LIMIT_NAMESPACE_ID/" workers/ourfinance-api/wrangler.ci.toml
      - name: Deploy only the test Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_TEST_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = 'ee6efc358047574c12f44e1411e0bf71'
          npx --yes wrangler@4.164.0 deploy --config workers/ourfinance-api/wrangler.ci.toml
      - name: Verify health, expense authentication and disabled privileged routes
        run: |
          base='https://ourfinance-api-dev.ur-inance.workers.dev'
          authenticated_routes=(
            'POST /groups/ci-disabled/archive'
            'POST /groups/ci-disabled/members/m/revoke'
            'PATCH /groups/ci-disabled/currency'
            'PATCH /groups/ci-disabled/metadata'
            'GET /groups/ci-disabled/member-profiles'
            'DELETE /groups/ci-disabled/backup/restores/123e4567-e89b-42d3-a456-426614174000'
            'POST /groups/ci-disabled/backup/restores/123e4567-e89b-42d3-a456-426614174000/commit'
            'POST /groups/ci-disabled/backup/restores/123e4567-e89b-42d3-a456-426614174000/prepare'
            'GET /groups/ci-disabled/backup/restores/123e4567-e89b-42d3-a456-426614174000/outcome'
            'GET /groups/ci-disabled/backup/restores/current'
            'GET /groups/ci-disabled/backup/preferences'
            'GET /groups/ci-disabled/backup/snapshot'
            'POST /groups/ci-disabled/expenses/e/comments'
            'POST /groups/ci-disabled/imports'
            'POST /groups/ci-disabled/receipt-upload-jobs/cleanup'
            'POST /groups/ci-disabled/expenses/e/attachments'
            'POST /groups/ci-disabled/settlements'
            'POST /groups/ci-disabled/categories'
            'POST /qr-invitations/preview'
            'POST /groups/ci-disabled/qr-invitations'
          )
          routes=(
          )
          for attempt in 1 2 3 4 5 6; do
            health="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$base/health")"
            expense_status="$(curl --silent --show-error --request POST --output /dev/null --write-out '%{http_code}' "$base/groups/ci-disabled/expenses")"
            preview_status="$(curl --silent --show-error --request POST --output /dev/null --write-out '%{http_code}' "$base/groups/ci-disabled/backup/preview")"
            failed=''
            for route in "${routes[@]}"; do
              read -r method path <<< "$route"
              status="$(curl --silent --show-error --request "$method" --output /dev/null --write-out '%{http_code}' "$base$path")"
              if [[ "$status" != 503 ]]; then failed="$method $path: $status"; break; fi
            done
            for route in "${authenticated_routes[@]}"; do
              read -r method path <<< "$route"
              status="$(curl --silent --show-error --request "$method" --output /dev/null --write-out '%{http_code}' "$base$path")"
              if [[ "$status" != 401 ]]; then failed="$method $path: $status"; break; fi
            done
            cors_failed=''
            for origin in https://ourfinance-test.web.app https://ourfinance-test.firebaseapp.com; do
              response_headers="$(curl --silent --show-error --dump-header - --output /dev/null --header "Origin: $origin" "$base/health" | tr -d '\r')"
              if ! printf '%s\n' "$response_headers" | grep -Fxiq "access-control-allow-origin: $origin"; then cors_failed="$origin"; break; fi
            done
            rejected="$(curl --silent --show-error --header 'Origin: https://untrusted.example' --output /dev/null --write-out '%{http_code}' "$base/health")"
            if [[ "$health" == 200 && "$expense_status" == 401 && "$preview_status" == 401 && -z "$failed" && -z "$cors_failed" && "$rejected" == 403 ]]; then exit 0; fi
            sleep 5
          done
          echo "TEST Worker smoke failed: health=$health, expenses=$expense_status, preview=$preview_status, route=$failed, cors=$cors_failed, rejected=$rejected" >&2
          exit 1
