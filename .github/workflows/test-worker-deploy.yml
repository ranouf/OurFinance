name: Deploy test Worker manually
on:
  pull_request:
    paths:
      - .github/workflows/test-worker-deploy.yml
      - workers/ourfinance-api/**
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA to deploy on TEST
        required: true
        type: string
      coordination_comment:
        description: URL of the active TEST reservation in issue 30
        required: true
        type: string
permissions:
  contents: read
  issues: read
  actions: read
jobs:
  worker_dry_run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check the TEST bundle without credentials
        run: |
          cat > workers/ourfinance-api/wrangler.ci.toml <<'EOF'
          name = "ourfinance-api-dev"
          main = "src/index.ts"
          compatibility_date = "2026-11-15"
          workers_dev = true

          [vars]
          FIREBASE_PROJECT_ID = "ourfinance-test"
          ALLOWED_ORIGIN = "https://ourfinance-test.web.app"

          [[ratelimits]]
          name = "API_RATE_LIMITER"
          namespace_id = "7491201"

          [ratelimits.simple]
          limit = 120
          period = 60
          EOF
          npx --yes wrangler@4.164.0 deploy --dry-run --config workers/ourfinance-api/wrangler.ci.toml
  worker_test:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'ranouf' && github.triggering_actor == 'ranouf'
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: ourfinance-test-deploy
      cancel-in-progress: false
    steps:
      - name: Check exact SHA and reservation
        env:
          TARGET_SHA: ${{ inputs.sha }}
          RESERVATION: ${{ inputs.coordination_comment }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RESERVATION" =~ ^https://github\.com/ranouf/OurFinance/issues/30#issuecomment-[0-9]+$ ]]
          comment_id="${RESERVATION##*issuecomment-}"
          gh api "repos/ranouf/OurFinance/issues/comments/$comment_id" |
            jq -e --arg sha "$TARGET_SHA" '
              now as $checked | (.created_at | fromdateiso8601) as $reserved |
              .user.login == "ranouf" and
              .issue_url == "https://api.github.com/repos/ranouf/OurFinance/issues/30" and
              $reserved <= $checked and ($checked - $reserved) <= 3600 and
              (.body | contains($sha) and (ascii_downcase | contains("test")) and
                test("r[ée]serv"; "i"))
            ' >/dev/null
      - name: Require successful PR validation on exact SHA
        env:
          TARGET_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/ranouf/OurFinance/actions/runs?head_sha=$TARGET_SHA&per_page=100" |
            jq -e --arg sha "$TARGET_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha and .path == ".github/workflows/pr-validation.yml")]
              | first | .conclusion == "success"
            ' >/dev/null
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out commit
        env:
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor 04d521960fc37e63266f72500ef0cc4fb0cd7393 HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck:worker && npm run test:worker
      - name: Write isolated deployment configuration
        env:
          RATE_LIMIT_NAMESPACE_ID: ${{ vars.CLOUDFLARE_TEST_RATE_LIMIT_NAMESPACE_ID }}
        run: |
          test "$RATE_LIMIT_NAMESPACE_ID" = '7491201'
          cat > workers/ourfinance-api/wrangler.ci.toml <<'EOF'
          name = "ourfinance-api-dev"
          main = "src/index.ts"
          compatibility_date = "2026-11-15"
          workers_dev = true

          [vars]
          FIREBASE_PROJECT_ID = "ourfinance-test"
          ALLOWED_ORIGIN = "https://ourfinance-test.web.app"

          [[ratelimits]]
          name = "API_RATE_LIMITER"
          namespace_id = "TEST_RATE_LIMIT_NAMESPACE_ID"

          [ratelimits.simple]
          limit = 120
          period = 60
          EOF
          sed -i "s/TEST_RATE_LIMIT_NAMESPACE_ID/$RATE_LIMIT_NAMESPACE_ID/" workers/ourfinance-api/wrangler.ci.toml
      - name: Deploy only the test Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_TEST_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = 'ee6efc358047574c12f44e1411e0bf71'
          npx --yes wrangler@4.164.0 deploy --config workers/ourfinance-api/wrangler.ci.toml
      - name: Verify health and privileged routes disabled by default
        run: |
          base='https://ourfinance-api-dev.ur-inance.workers.dev'
          routes=(
            'POST /groups/ci-disabled/expenses'
            'POST /groups/ci-disabled/settlements'
            'POST /groups/ci-disabled/imports'
            'POST /groups/ci-disabled/categories'
            'POST /groups/ci-disabled/qr-invitations'
            'POST /qr-invitations/preview'
            'POST /groups/ci-disabled/expenses/e/attachments'
            'POST /groups/ci-disabled/receipt-upload-jobs/cleanup'
            'GET /groups/ci-disabled/member-profiles'
            'GET /groups/ci-disabled/backup/snapshot'
            'GET /groups/ci-disabled/backup/restores/current'
          )
          for attempt in 1 2 3 4 5 6; do
            health="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$base/health")"
            failed=''
            for route in "${routes[@]}"; do
              read -r method path <<< "$route"
              status="$(curl --silent --show-error --request "$method" --output /dev/null --write-out '%{http_code}' "$base$path")"
              if [[ "$status" != 503 ]]; then failed="$method $path: $status"; break; fi
            done
            if [[ "$health" == 200 && -z "$failed" ]]; then exit 0; fi
            sleep 5
          done
          echo "TEST Worker smoke failed: health=$health, route=$failed" >&2
          exit 1
