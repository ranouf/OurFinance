name: Monitor TEST Cloudflare Free quota
on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      simulated_requests:
        description: 'Simulation explicite du nombre de requêtes, facultative ; aucun trafic réel généré'
        required: false
        type: string
permissions:
  contents: read
  issues: write
concurrency:
  group: test-cloudflare-quota-alert
  cancel-in-progress: false
jobs:
  monitor:
    if: github.repository == 'ranouf/OurFinance'
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Vérifier le quota compte Workers Free
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_TEST_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          SIMULATED_REQUESTS: ${{ inputs.simulated_requests }}
        run: node tools/quota-monitor/cloudflare-alert.mjs
