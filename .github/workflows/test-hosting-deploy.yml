name: Deploy test Hosting manually
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA to deploy on TEST
        required: true
        type: string
      coordination_comment:
        description: URL of the active TEST reservation in issue 30
        required: true
        type: string
      approval_comment:
        description: URL of the owner's approval for this exact SHA and channel
        required: true
        type: string
      channel:
        description: Deploy an isolated preview or the main TEST site
        required: true
        type: choice
        options:
          - preview
          - live
permissions:
  contents: read
  issues: read
  actions: read
jobs:
  hosting_test:
    if: github.ref == 'refs/heads/main' && github.actor == 'ranouf' && github.triggering_actor == 'ranouf'
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: ourfinance-test-deploy
      cancel-in-progress: false
    steps:
      - name: Check exact SHA, reservation and visual approval
        env:
          TARGET_SHA: ${{ inputs.sha }}
          RESERVATION: ${{ inputs.coordination_comment }}
          APPROVAL: ${{ inputs.approval_comment }}
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RESERVATION" =~ ^https://github\.com/ranouf/OurFinance/issues/30#issuecomment-[0-9]+$ ]]
          [[ "$APPROVAL" =~ ^https://github\.com/ranouf/OurFinance/issues/(30|122)#issuecomment-[0-9]+$ ]]
          [[ "$CHANNEL" == preview || "$CHANNEL" == live ]]
          reservation_id="${RESERVATION##*issuecomment-}"
          gh api "repos/ranouf/OurFinance/issues/comments/$reservation_id" |
            jq -e --arg sha "$TARGET_SHA" '
              now as $checked | (.created_at | fromdateiso8601) as $reserved |
              .user.login == "ranouf" and
              .issue_url == "https://api.github.com/repos/ranouf/OurFinance/issues/30" and
              $reserved <= $checked and ($checked - $reserved) <= 3600 and
              (.body | contains($sha) and (ascii_downcase | contains("test")) and test("r[ée]serv"; "i"))
            ' >/dev/null
          approval_id="${APPROVAL##*issuecomment-}"
          gh api "repos/ranouf/OurFinance/issues/comments/$approval_id" |
            jq -e --arg sha "$TARGET_SHA" --arg channel "$CHANNEL" '
              .user.login == "ranouf" and
              (.issue_url == "https://api.github.com/repos/ranouf/OurFinance/issues/30" or
               .issue_url == "https://api.github.com/repos/ranouf/OurFinance/issues/122") and
              (.body | contains($sha) and (ascii_downcase | contains("validation visuelle")) and
                (if $channel == "live" then test("approuv"; "i") else test("preview|aperçu"; "i") end))
            ' >/dev/null
      - name: Require successful PR validation on exact SHA
        env:
          TARGET_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/ranouf/OurFinance/actions/runs?head_sha=$TARGET_SHA&per_page=100" |
            jq -e --arg sha "$TARGET_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha and .path == ".github/workflows/pr-validation.yml")]
              | first | .conclusion == "success"
            ' >/dev/null
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out commit and channel
        env:
          TARGET_SHA: ${{ inputs.sha }}
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          if [[ "$CHANNEL" == live ]]; then
            gh api "repos/ranouf/OurFinance/compare/$TARGET_SHA...main" |
              jq -e '.status == "ahead" or .status == "identical"' >/dev/null
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Check isolated test configuration
        env:
          TEST_FIREBASE_DEPLOY_SA_JSON: ${{ secrets.TEST_FIREBASE_DEPLOY_SA_JSON }}
          TEST_FIREBASE_API_KEY: ${{ secrets.TEST_FIREBASE_API_KEY }}
          TEST_FIREBASE_AUTH_DOMAIN: ${{ vars.TEST_FIREBASE_AUTH_DOMAIN }}
          TEST_FIREBASE_PROJECT_ID: ${{ vars.TEST_FIREBASE_PROJECT_ID }}
          TEST_FIREBASE_APP_ID: ${{ vars.TEST_FIREBASE_APP_ID }}
        run: |
          test "$TEST_FIREBASE_PROJECT_ID" = 'ourfinance-test'
          test "$TEST_FIREBASE_AUTH_DOMAIN" = 'ourfinance-test.firebaseapp.com'
          test -n "$TEST_FIREBASE_DEPLOY_SA_JSON"
          test -n "$TEST_FIREBASE_API_KEY"
          test -n "$TEST_FIREBASE_APP_ID"
      - run: npm ci
      - name: Build isolated test app
        env:
          TEST_FIREBASE_API_KEY: ${{ secrets.TEST_FIREBASE_API_KEY }}
          TEST_FIREBASE_AUTH_DOMAIN: ${{ vars.TEST_FIREBASE_AUTH_DOMAIN }}
          TEST_FIREBASE_PROJECT_ID: ${{ vars.TEST_FIREBASE_PROJECT_ID }}
          TEST_FIREBASE_APP_ID: ${{ vars.TEST_FIREBASE_APP_ID }}
          TEST_WORKER_URL: https://ourfinance-api-dev.ur-inance.workers.dev
        run: |
          npm run config:test
          npm run typecheck
          npm run build
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.TEST_FIREBASE_DEPLOY_SA_JSON }}
      - name: Deploy Hosting preview for a branch
        if: inputs.channel == 'preview'
        run: npx firebase-tools hosting:channel:deploy "preview-${GITHUB_RUN_ID}" --project ourfinance-test --expires 1d --non-interactive
      - name: Deploy Hosting to test only
        if: inputs.channel == 'live'
        run: npx firebase-tools deploy --only hosting --project ourfinance-test --non-interactive
      - name: Verify deployed Hosting headers
        if: inputs.channel == 'live'
        run: |
          verify_path() {
            local host="$1" path="$2" headers
            for attempt in 1 2 3 4 5 6; do
              headers="$(curl --fail --silent --show-error --location --head "https://$host$path" | tr -d '\r')" || headers=''
              if printf '%s\n' "$headers" | grep -qi '^referrer-policy: no-referrer$' \
                && printf '%s\n' "$headers" | grep -qi '^x-content-type-options: nosniff$' \
                && printf '%s\n' "$headers" | grep -qi '^x-frame-options: DENY$' \
                && printf '%s\n' "$headers" | grep -qi "^content-security-policy: .*frame-ancestors 'none'" \
                && printf '%s\n' "$headers" | grep -qi "script-src 'self'"; then
                return 0
              fi
              sleep 5
            done
            echo "En-têtes Hosting manquants sur $host$path" >&2
            return 1
          }
          for host in ourfinance-test.web.app ourfinance-test.firebaseapp.com; do
            verify_path "$host" /
            verify_path "$host" /dashboard
            verify_path "$host" /join
          done
