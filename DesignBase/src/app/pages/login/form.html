<div class="auth-card">
  <div class="auth-tabs">
    <button type="button" class="active" data-auth-mode="signin">Sign in</button>
    <button type="button" data-auth-mode="signup">Sign up</button>
  </div>
  <form id="auth-form">
    <label>Email<span class="login-field">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m3 6 9 7 9-7"/></svg>
      <input type="email" autocomplete="email" required placeholder="Enter your email">
    </span></label>
    <label>Password<span class="login-field password-control">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="10" width="18" height="12" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3m-5 5v3"/></svg>
      <input id="auth-password" type="password" required placeholder="Enter your password">
      <button type="button" id="show-password" aria-label="Show password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </span></label>
    <a class="forgot" href="#recovery">Forgot password?</a>
    <button class="page-primary" id="auth-submit" type="submit">Sign in</button>
    <div class="auth-divider">or</div>
    <button class="google-button" type="button" data-prototype-action="Continue with Google"><span aria-hidden="true" class="google-mark">G</span>Continue with Google</button>
    <p>Don’t have an account? <a href="#signup">Create account</a></p>
  </form>
</div>
