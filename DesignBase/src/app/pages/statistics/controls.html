<div class="stats-controls">
  <button type="button" class="context-select" data-prototype-action="Choose group">♧ &nbsp;Roommates ⌄</button>
  <div class="period-picker">
    <button type="button" class="context-select" id="period-button" #trigger popovertarget="period-popover">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 2v6m10-6v6M3 11h18"/></svg>
      {{ rangeLabel }} <span class="period-chevron" aria-hidden="true"></span>
    </button>
    <div popover="auto" class="period-popover" id="period-popover" (beforetoggle)="restore($event, periodForm, to)">
      <form (submit)="apply($event, trigger)" #periodForm>
        <div class="period-tabs">
          @for (unit of ['Days', 'Months', 'Years']; track unit) {
            <label><input type="radio" name="period" [value]="unit" [checked]="unit === savedUnit"> {{ unit }}</label>
          }
        </div>
        <div class="period-dates">
          <label>From<input type="date" name="start" [value]="start" #from required (input)="to.min = from.value"></label>
          <label>To (inclusive)<input type="date" name="end" [value]="end" [min]="start" #to required></label>
        </div>
        <div class="period-actions">
          <button type="button" popovertarget="period-popover" popovertargetaction="hide">Cancel</button>
          <button type="submit">Apply</button>
        </div>
      </form>
    </div>
  </div>
</div>
